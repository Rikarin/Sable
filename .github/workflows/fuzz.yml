# Fuzzes every night, from a new seed each time:
#
# - fromBytes: tools/fuzz/run.sh, mutated inline-layout records under
#   AddressSanitizer and UndefinedBehaviorSanitizer (docs/04 §3.8);
# - the parser: the random-input round-trip tests, many times over;
# - the compiler: CompilerFuzzTests, mutated programs from the repository
#   through parsing, binding, constant evaluation, lowering, the SIL
#   verifier and the passes;
# - the package resolver: ResolverFuzzTests, random registries through
#   PubGrub (checked against trying every assignment) and random text
#   through the version parsers.
#
# - coverage-guided: tools/fuzz/coverage.sh, the parser, the front end, the
#   resolver, the package files and fromBytes under libFuzzer, steered by
#   the code each input reaches, 90 minutes a target (each a job of its own,
#   inside the two hours a job may take), from the corpus the night
#   before kept (actions/cache). What fails is uploaded, with a minimised
#   reproducer for each.
#
# Steps run under 'shell: bash', which GitHub runs with pipefail, so a
# failure piped through 'tee' still fails the job. Each job prints its seed
# in the run's summary; to reproduce a failure, run the same job with that
# seed, from the Actions tab ("Run workflow") or locally with
# SABLE_FUZZ_SEED (and SABLE_FUZZ_CASES / SABLE_FUZZ_SCALE) set.
name: Nightly fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Seed (empty for a new one)
        required: false
        default: ""
      cases:
        description: fromBytes cases
        required: false
        default: "200000000"
      scale:
        description: Parser iterations, times the tests' usual count
        required: false
        default: "2000"
      compiler_scale:
        description: Compiler mutants, times the test's usual 24
        required: false
        default: "600"
      resolver_scale:
        description: Resolver and version-parser iterations, times the tests' usual count
        required: false
        default: "200"
      coverage_minutes:
        description: Minutes of coverage-guided fuzzing for each target (each target is a job of its own, and a job may run two hours)
        required: false
        default: "90"

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  from-bytes:
    name: fromBytes under sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      - name: Install clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang

      - name: Choose the seed
        id: seed
        env:
          GIVEN: ${{ inputs.seed }}
        run: |
          seed="${GIVEN:-$(( ( $(date +%s) * 7919 + ${{ github.run_id }} ) % 2147483647 ))}"
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "fromBytes seed: \`$seed\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Fuzz
        env:
          SABLE_FUZZ_SEED: ${{ steps.seed.outputs.seed }}
          SABLE_FUZZ_CASES: ${{ inputs.cases || '200000000' }}
        run: tools/fuzz/run.sh 2>&1 | tee fuzz.log

      - name: Keep the log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: from-bytes-${{ steps.seed.outputs.seed }}
          path: fuzz.log

  parser:
    name: Parser round trips
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      - name: Choose the seed
        id: seed
        env:
          GIVEN: ${{ inputs.seed }}
        run: |
          seed="${GIVEN:-$(( ( $(date +%s) * 104729 + ${{ github.run_id }} ) % 2147483647 ))}"
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "parser seed: \`$seed\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Fuzz
        env:
          SABLE_FUZZ_SEED: ${{ steps.seed.outputs.seed }}
          SABLE_FUZZ_SCALE: ${{ inputs.scale || '2000' }}
        run: |
          dotnet test tests/Sable.Syntax.Tests -c Release \
            --filter "FullyQualifiedName~Soup" \
            --logger "console;verbosity=normal" 2>&1 | tee fuzz.log

      - name: Keep the log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parser-${{ steps.seed.outputs.seed }}
          path: fuzz.log

  compiler:
    name: Compiler on mutated programs
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      - name: Choose the seed
        id: seed
        env:
          GIVEN: ${{ inputs.seed }}
        run: |
          seed="${GIVEN:-$(( ( $(date +%s) * 1299709 + ${{ github.run_id }} ) % 2147483647 ))}"
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "compiler seed: \`$seed\`" >> "$GITHUB_STEP_SUMMARY"

      # Each input is written to crash/current.sb before it is compiled, so
      # that one which takes the process down (a stack overflow cannot be
      # caught) is kept with the log.
      - name: Fuzz
        env:
          SABLE_FUZZ_SEED: ${{ steps.seed.outputs.seed }}
          SABLE_FUZZ_SCALE: ${{ inputs.compiler_scale || '600' }}
          SABLE_FUZZ_CRASH_DIR: ${{ github.workspace }}/crash
        run: |
          dotnet test tests/Sable.SIL.Tests -c Release \
            --filter "FullyQualifiedName~CompilerFuzzTests" \
            --logger "console;verbosity=normal" 2>&1 | tee fuzz.log

      - name: Keep the log and the input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-${{ steps.seed.outputs.seed }}
          path: |
            fuzz.log
            crash/

  resolver:
    name: Package resolver
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      - name: Choose the seed
        id: seed
        env:
          GIVEN: ${{ inputs.seed }}
        run: |
          seed="${GIVEN:-$(( ( $(date +%s) * 15485863 + ${{ github.run_id }} ) % 2147483647 ))}"
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "resolver seed: \`$seed\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Fuzz
        env:
          SABLE_FUZZ_SEED: ${{ steps.seed.outputs.seed }}
          SABLE_FUZZ_SCALE: ${{ inputs.resolver_scale || '200' }}
        run: |
          dotnet test tests/Sable.CodeGen.Tests -c Release \
            --filter "FullyQualifiedName~ResolverFuzzTests" \
            --logger "console;verbosity=normal" 2>&1 | tee fuzz.log

      - name: Keep the log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resolver-${{ steps.seed.outputs.seed }}
          path: fuzz.log

  # One job for each target, so that each has a runner of its own and the
  # whole of the two hours a job may take: the minutes asked for, and the
  # build before and the triage after.
  coverage:
    name: Coverage-guided (libFuzzer), ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    strategy:
      fail-fast: false
      matrix:
        target: [parser, frontend, resolver, packages, frombytes]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      # clang with libFuzzer's runtime, for fromBytes and for libfuzzer-dotnet.
      - name: Install clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libclang-rt-18-dev

      # libfuzzer-dotnet: libFuzzer's side of fuzzing a .NET program, which
      # runs the program in a process of its own and reads SharpFuzz's
      # coverage map from it. Built from its source at a pinned release,
      # checked against the hash of that source.
      - name: Build libfuzzer-dotnet
        run: |
          curl -fsSL -o "$RUNNER_TEMP/libfuzzer-dotnet.cc" \
            https://raw.githubusercontent.com/Metalnem/libfuzzer-dotnet/v2025.05.02.0904/libfuzzer-dotnet.cc
          echo "90f019e2e9ad3a0b93c7ecc2c5afb2fbfc8b5aab6aac51c7e0d349ec79354f36  $RUNNER_TEMP/libfuzzer-dotnet.cc" | sha256sum -c -
          clang -O2 -fsanitize=fuzzer "$RUNNER_TEMP/libfuzzer-dotnet.cc" -o "$RUNNER_TEMP/libfuzzer-dotnet"
          echo "LIBFUZZER_DOTNET=$RUNNER_TEMP/libfuzzer-dotnet" >> "$GITHUB_ENV"

      # The corpus every night before kept for this target: each starts where
      # the last left off.
      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: artifacts/fuzz-corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # coverage.sh holds itself to the minutes asked for: it kills an
      # engine still running two minutes past them (FUZZ_GRACE) and stops
      # triage ten minutes after that (FUZZ_TRIAGE). This step's own limit is
      # the last resort, short of the job's, so that whatever happens the
      # steps after it still summarise the run and keep what it found.
      - name: Fuzz
        id: fuzz
        timeout-minutes: 105
        env:
          MINUTES: ${{ inputs.coverage_minutes || '90' }}
          TARGET: ${{ matrix.target }}
        run: tools/fuzz/coverage.sh "${MINUTES}m" "$TARGET" 2>&1 | tee fuzz.log

      - name: Save the corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: artifacts/fuzz-corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      # The target must have run under libFuzzer, and found nothing. Run when
      # the fuzzing step failed too, as when its own limit stopped it; a run
      # stopped before it summarised itself is summarised here.
      - name: Summarise
        id: summary
        if: ${{ !cancelled() && steps.fuzz.outcome != 'skipped' }}
        run: |
          run=$(find artifacts/fuzz -mindepth 1 -maxdepth 1 -type d -name '[0-9]*' | sort | tail -1)
          echo "run=$run" >> "$GITHUB_OUTPUT"
          [ -s "$run/summary.txt" ] || tools/fuzz/coverage.sh --summary "$run" > /dev/null
          {
            echo '```'
            cat "$run/summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'not fuzzed' "$run"/*/about; then
            echo "a target did not run under libFuzzer" >&2
            exit 1
          fi
          if [ -s "$run/failures.tsv" ]; then
            exit 1
          fi
          # An engine that cannot start runs nothing and finds nothing: not a pass.
          if [ "$(find "$run" -mindepth 2 -maxdepth 2 -name about | wc -l)" -lt 1 ] || grep '; 0 inputs run' "$run"/*/about; then
            echo "a target ran no inputs; see its run-*.log" >&2
            exit 1
          fi

      - name: Keep the failures
        if: failure() && steps.summary.outputs.run != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.target }}-${{ github.run_id }}
          path: |
            fuzz.log
            ${{ steps.summary.outputs.run }}/summary.txt
            ${{ steps.summary.outputs.run }}/failures.tsv
            ${{ steps.summary.outputs.run }}/*/crashes/
            ${{ steps.summary.outputs.run }}/*/run-*.log
            ${{ steps.summary.outputs.run }}/build.log
