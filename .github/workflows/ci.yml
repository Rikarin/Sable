# Builds and tests the compiler on Linux (x64 and arm64), macOS and Windows,
# runs programs built for WebAssembly under WASI, checks the library is
# formatted, and checks the VS Code extension — on every push to the main
# branches and every pull request.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # Every test project but Sable.CodeGen.Tests, which the codegen job runs
  # in shards; then the timing tests, the formatting check and, on Linux
  # x64, the library's doc examples. (Its coverage is coverage.yml's.)
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-2025' && 120 || 90 }}
    env:
      # The timing tests include some of Sable.CodeGen.Tests': as the codegen job.
      SABLE_TEST_NATIVE: all
      # Linux arm64 leaves the fuzz tests to the nightly job, which runs them
      # on x64: what they find is the compiler's, not the machine's. Its
      # runners are no faster, and the job must end inside the limit.
      TEST_FILTER: ${{ matrix.os == 'ubuntu-24.04-arm' && 'Category!=Fuzz&Category!=Timing' || 'Category!=Timing' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      # Native code is compiled with clang, and the debugger tests drive lldb;
      # macOS has both with Xcode.
      - name: Install clang and lldb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lldb

      # The Windows image has LLVM's clang and lld, and Visual Studio's C
      # runtime and Windows SDK, which clang finds by itself.
      - name: Show the C compiler
        run: clang --version

      # On its own first, so that a platform layer that does not compile
      # says so once, not in every test that builds a program.
      - name: Runtime compiles
        run: clang -c -O2 -Wall -Wextra runtime/sable_runtime.c -o "$RUNNER_TEMP/sable_runtime.o"

      - name: Build
        run: dotnet build Sable.slnx -c Release

      # A test that hangs is stopped and named, rather than taking the job
      # to its limit with nothing said: none takes near half an hour.
      - name: Test
        run: |
          for project in Sable.Syntax.Tests Sable.Symbols.Tests Sable.SIL.Tests Sable.LanguageServer.Tests; do
            dotnet test "tests/$project" -c Release --no-build --logger "console;verbosity=minimal" --filter "$TEST_FILTER" \
              --blame-hang-timeout 30m --blame-hang-dump-type none
          done

      # The front end again, with the standard library's declarations taken
      # from its interface rather than its source (docs/05 §5.4). Once, on
      # Linux x64: what it compares is the same everywhere.
      - name: Symbols against the library's interface
        if: matrix.os == 'ubuntu-24.04'
        env:
          SABLE_LIBRARY_SYMBOLS: interface
        run: |
          dotnet test tests/Sable.Symbols.Tests -c Release --no-build --logger "console;verbosity=minimal" --filter "$TEST_FILTER" \
            --blame-hang-timeout 30m --blame-hang-dump-type none

      # The tests that measure time, alone: with the rest of the suite running
      # beside them a shared runner's two or three cores are not theirs.
      - name: Timing tests
        if: matrix.os != 'ubuntu-24.04-arm'
        run: dotnet test Sable.slnx -c Release --no-build --logger "console;verbosity=normal" --filter "Category=Timing"

      - name: Library and examples are formatted
        run: src/Sable.Driver/bin/Release/net11.0/sable fmt --check lib examples tools/fuzz

      # The ```sable examples of the library's doc comments, each module's
      # run as its tests (sable test --doc). Once, on Linux x64: the
      # library's code is the same everywhere.
      - name: Standard library doc examples
        if: matrix.os == 'ubuntu-24.04'
        run: |
          for module in lib/*/; do
            echo "== $module"
            src/Sable.Driver/bin/Release/net11.0/sable test --doc "$module"
          done

  # Sable.CodeGen.Tests — native code, the runtime, packages and the CLI —
  # split by test class into shards that run side by side
  # (tools/ci/codegen-shard.sh, whose count the matrix's 'shard' must list:
  # ShardTests checks both). Every test that holds native code and the
  # interpreter to the same answer builds natively here (SABLE_TEST_NATIVE),
  # where locally only those marked [Native] do.
  codegen:
    name: CodeGen tests ${{ matrix.shard }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    # The whole project took 75 minutes on Linux and macOS and over 108 on
    # Windows, where each test program is linked by lld-link and started as
    # a process; a shard is about a quarter of it.
    timeout-minutes: ${{ matrix.os == 'windows-2025' && 100 || 60 }}
    env:
      SABLE_TEST_NATIVE: all
      # As the test job: Linux arm64 leaves the fuzz tests to the nightly job.
      TEST_FILTER: ${{ matrix.os == 'ubuntu-24.04-arm' && 'Category!=Fuzz&Category!=Timing' || 'Category!=Timing' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      - name: Install clang and lldb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lldb

      - name: Show the C compiler
        run: clang --version

      - name: Build
        run: dotnet build tests/Sable.CodeGen.Tests -c Release

      - name: Test
        run: >-
          dotnet test tests/Sable.CodeGen.Tests -c Release --no-build --logger "console;verbosity=minimal"
          --filter "($(tools/ci/codegen-shard.sh ${{ matrix.shard }}))&$TEST_FILTER"
          --blame-hang-timeout 30m --blame-hang-dump-type none

  # Programs built for wasm32-wasi (runtime/platform_wasi.c) and run under
  # wasmtime. The C compiler is wasi-sdk's clang, which has wasm-ld,
  # compiler-rt's WebAssembly builtins and wasi-libc's sysroot together;
  # the compiler finds the sysroot in /opt/wasi-sdk by itself.
  wasi:
    name: WASI (wasm32-wasi under wasmtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WASI_SDK_VERSION: "25"
      CC: /opt/wasi-sdk/bin/clang
      # WasiTests fail, rather than pass vacuously, without wasmtime or a sysroot.
      SABLE_WASI_TESTS: required
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      - name: Install wasi-sdk
        run: |
          curl -fsSL -o "$RUNNER_TEMP/wasi-sdk.tar.gz" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz"
          sudo mkdir -p /opt/wasi-sdk
          sudo tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C /opt/wasi-sdk --strip-components=1
          "$CC" --version

      - uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Show wasmtime
        run: wasmtime --version

      - name: Runtime compiles for WASI
        run: |
          "$CC" --target=wasm32-wasi --sysroot=/opt/wasi-sdk/share/wasi-sysroot \
            -c -O2 -Wall -Wextra runtime/sable_runtime.c -o "$RUNNER_TEMP/sable_runtime.o"

      - name: Build
        run: dotnet build tests/Sable.CodeGen.Tests -c Release

      - name: WASI tests
        run: >-
          dotnet test tests/Sable.CodeGen.Tests -c Release --no-build
          --logger "console;verbosity=normal"
          --filter "Category!=Fuzz&Category!=Timing&FullyQualifiedName~WasiTests"

      - name: Hello, world under wasmtime
        run: |
          src/Sable.Driver/bin/Release/net11.0/sable build examples/01-hello.sb --target wasm32-wasi -o "$RUNNER_TEMP/hello.wasm"
          wasmtime run "$RUNNER_TEMP/hello.wasm"

  vscode:
    name: VS Code extension
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Grammar and extension tests
        run: npm test
      - name: Other editors' files (Vim, Neovim, Helix, Emacs, Sublime)
        working-directory: editors
        run: node --test test/editors.test.js
