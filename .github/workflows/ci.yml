# Builds and tests the compiler on Linux, macOS and Windows, checks the library is
# formatted, and checks the VS Code extension — on every push to the main
# branches and every pull request.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      # Native code is compiled with clang, and the debugger tests drive lldb;
      # macOS has both with Xcode.
      - name: Install clang and lldb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lldb

      # The Windows image has LLVM's clang and lld, and Visual Studio's C
      # runtime and Windows SDK, which clang finds by itself.
      - name: Show the C compiler
        run: clang --version

      # On its own first, so that a platform layer that does not compile
      # says so once, not in every test that builds a program.
      - name: Runtime compiles
        run: clang -c -O2 -Wall -Wextra runtime/sable_runtime.c -o "$RUNNER_TEMP/sable_runtime.o"

      - name: Build
        run: dotnet build Sable.slnx -c Release

      - name: Test
        run: dotnet test Sable.slnx -c Release --no-build --logger "console;verbosity=minimal" --filter "Category!=Timing"

      # The tests that measure time, alone: with the rest of the suite running
      # beside them a shared runner's two or three cores are not theirs.
      - name: Timing tests
        run: dotnet test Sable.slnx -c Release --no-build --logger "console;verbosity=normal" --filter "Category=Timing"

      - name: Library and examples are formatted
        run: src/Sable.Driver/bin/Release/net11.0/sable fmt --check lib examples tools/fuzz

  vscode:
    name: VS Code extension
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Grammar and extension tests
        run: npm test
      - name: Other editors' files (Vim, Neovim, Helix, Emacs, Sublime)
        working-directory: editors
        run: node --test test/editors.test.js
